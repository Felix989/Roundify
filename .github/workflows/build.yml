name: Build Roundify

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: .\publish-win-x64.cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roundify-win-x64
          path: publish/win-x64/Roundify.exe
